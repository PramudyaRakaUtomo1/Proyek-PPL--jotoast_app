<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Edit Produk - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='jotoast.css') }}">
</head>
<body class="form-page font-sans flex items-center justify-center">

    {% include '_admin_toasts.html' %}

    <div class="form-card bg-white p-8 rounded-2xl w-full max-w-lg">
        <h2 class="text-3xl font-extrabold text-gray-900 mb-6">Edit Produk</h2>
        
        <form action="/admin/produk/edit/{{ produk.id }}" method="POST" enctype="multipart/form-data" class="space-y-5">
            <div>
                <label class="block text-gray-800 font-semibold mb-2">Nama Produk</label>
                <input type="text" name="nama" value="{{ produk.nama }}" required class="w-full p-3 border border-gray-300 rounded-lg focus:border-[#f5b841] focus:ring-1 focus:ring-[#f5b841]">
            </div>
            <div>
                <label class="block text-gray-800 font-semibold mb-2">Harga (Rp)</label>
                <input type="number" name="harga" value="{{ produk.harga }}" required class="w-full p-3 border border-gray-300 rounded-lg focus:border-[#f5b841] focus:ring-1 focus:ring-[#f5b841]">
            </div>
            <div>
                <label class="block text-gray-800 font-semibold mb-2">Ganti Foto Produk</label>
                <input
                    type="file"
                    name="gambar"
                    accept=".jpg,.jpeg,.png,.gif,.webp,image/jpeg,image/png,image/gif,image/webp"
                    class="w-full p-3 border border-gray-300 rounded-lg focus:border-[#f5b841] focus:ring-1 focus:ring-[#f5b841]"
                >
                {% if produk.gambar|gambar_produk(produk.nama) %}
                <p class="mt-2 text-sm text-gray-500">Foto saat ini:</p>
                <img
                    src="{{ produk.gambar|gambar_produk(produk.nama) }}"
                    alt="{{ produk.nama }}"
                    class="mt-3 h-24 w-24 rounded-lg object-cover"
                >
                {% endif %}
                <p class="mt-1 text-sm text-gray-500">Kosongkan jika tidak ingin mengganti foto. Format JPG, PNG, GIF, atau WEBP (maks. 5 MB).</p>
            </div>
            <div>
                <label class="block text-gray-800 font-semibold mb-2">Kategori</label>
                <select name="kategori_id" required class="w-full p-3 border border-gray-300 rounded-lg focus:border-[#f5b841]">
                    {% for kat in kategori %}
                    <option value="{{ kat.id }}" {% if kat.id == produk.kategori_id %}selected{% endif %}>{{ kat.nama }}</option>
                    {% endfor %}
                </select>
            </div>
           <div>
                <label class="block text-gray-800 font-semibold mb-2">
                    Jumlah Stok Produk
                </label>

                <input
                    type="number"
                    name="stok"
                    min="0"
                    value="{{ produk.stok }}"
                    required
                    class="w-full p-3 border border-gray-300 rounded-lg"
                >
            </div>
            <div class="flex gap-3 mt-8">
                <a href="/admin/produk" class="flex-1 py-3 text-center rounded-lg bg-gray-200 text-gray-700 font-bold hover:bg-gray-300">Batal</a>
                <button type="submit" class="flex-1 py-3 rounded-lg bg-[#1a1714] text-white font-bold hover:bg-black">Update Produk</button>
            </div>
        </form>
    </div>
</body>
</html>
