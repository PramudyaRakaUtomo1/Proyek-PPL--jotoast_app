<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login Pegawai - Jotoast</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='jotoast.css') }}">
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-brand-panel" aria-label="Jotoast">
            <a href="/" class="login-back">&larr; Kembali ke Beranda</a>
            <div class="login-brand-copy">
                <h1>JOTOAST</h1>
                <p>Ricebowl, tost, dan kopi</p>
            </div>
        </section>

        <section class="login-form-panel">
            <div class="login-form-content">
                <h2>Masuk</h2>
                {% if error %}
                <p class="login-error" role="alert">{{ error }}</p>
                {% endif %}
                <form action="{{ url_for('login') }}" method="POST" class="login-form">
                    <fieldset class="login-role-options" aria-label="Pilih jenis akun">
                        <legend class="sr-only">Masuk sebagai</legend>
                        <label class="login-role-option">
                            <input type="radio" name="role" value="owner" checked>
                            <span>Admin</span>
                        </label>
                        <label class="login-role-option">
                            <input type="radio" name="role" value="kasir">
                            <span>Kasir</span>
                        </label>
                    </fieldset>

                    <div class="login-field">
                        <label for="username">Masukkan Username</label>
                        <input id="username" type="text" name="username" autocomplete="username" placeholder="Masukkan username" required>
                    </div>
                    <div class="login-field">
                        <label for="password">Masukkan Kata Sandi</label>
                        <input id="password" type="password" name="password" autocomplete="current-password" placeholder="Masukkan kata sandi" required>
                    </div>
                    <button type="submit" class="login-submit">Masuk</button>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
