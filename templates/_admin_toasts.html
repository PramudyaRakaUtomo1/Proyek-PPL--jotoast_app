<div class="admin-toast-stack" aria-live="polite" aria-relevant="additions">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        {% if category in ['admin_success', 'admin_error', 'sukses', 'error'] %}
        <div class="admin-toast {% if category in ['admin_error', 'error'] %}is-error{% else %}is-success{% endif %}"
             role="{% if category in ['admin_error', 'error'] %}alert{% else %}status{% endif %}">
            <span>{{ message }}</span>
            <button type="button" class="admin-toast-close" aria-label="Tutup notifikasi">×</button>
        </div>
        {% endif %}
        {% endfor %}
    {% endwith %}
</div>
<script>
    document.querySelectorAll('.admin-toast').forEach((toast) => {
        const dismiss = () => toast.remove();
        toast.querySelector('.admin-toast-close').addEventListener('click', dismiss);
        window.setTimeout(dismiss, 6000);
    });
</script>
